name: Security Audit

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production security audit (moderate+)
        run: npm run audit:security
