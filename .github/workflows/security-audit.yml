name: Security Audit

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production security audit (moderate+)
        run: npm run audit:security
